version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname EDGE-R1
!
boot-start-marker
boot-end-marker
!
enable secret <REDACTED>
!
no aaa new-model
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
ip dhcp excluded-address 10.1.1.1 10.1.1.99
ip dhcp excluded-address 10.1.2.1 10.1.2.99
ip dhcp excluded-address 10.1.3.1 10.1.3.99
!
ip dhcp pool FLOOR1
 network 10.1.1.0 255.255.255.0
 default-router 10.1.1.1 
 dns-server 8.8.8.8 
!
ip dhcp pool FLOOR2
 network 10.1.2.0 255.255.255.0
 default-router 10.1.2.1 
 dns-server 8.8.8.8 
!
ip dhcp pool FLOOR3
 network 10.1.3.0 255.255.255.0
 default-router 10.1.3.1 
 dns-server 8.8.8.8 
!
no ip domain lookup
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
username admin privilege 15 secret <REDACTED>
!
redundancy
!
interface Loopback0
 description ROUTER-ID
 ip address 10.1.0.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description to-CORE-R2-Gi0/1
 ip address 10.1.255.5 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description to-CORE-R1-Gi0/1
 ip address 10.1.255.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 description to-ISP-Gi0/0
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.1.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 default-information originate
!
router bgp 65001
 bgp router-id 10.1.0.1
 bgp log-neighbor-changes
 network 10.1.0.0 mask 255.255.0.0
 neighbor 203.0.113.1 remote-as 65000
 neighbor 203.0.113.1 description ISP
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/2 overload
ip route 10.1.0.0 255.255.0.0 Null0
ip ssh version 2
!
ip access-list extended NAT-INSIDE
 deny   ip 10.1.0.0 0.0.255.255 172.16.0.0 0.0.255.255
 permit ip 10.1.0.0 0.0.255.255 any
!
ipv6 ioam timestamp
!
control-plane
!
banner exec ^C
