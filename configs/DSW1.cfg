!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname DSW1
!
boot-start-marker
boot-end-marker
!
enable secret <REDACTED>
!
username admin privilege 15 secret <REDACTED>
no aaa new-model
!
no ip domain-lookup
ip domain-name lab.local
ip cef
no ipv6 cef
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,99 priority 4096
spanning-tree vlan 30 priority 8192
!
interface Loopback0
 description ROUTER-ID
 ip address 10.1.0.11 255.255.255.255
 ip ospf 1 area 0
!
interface Port-channel1
 description ISL-to-DSW2
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
!
interface GigabitEthernet0/0
 description ISL-to-DSW2
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 negotiation auto
 channel-group 1 mode active
!
interface GigabitEthernet0/1
 description ISL-to-DSW2
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 negotiation auto
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 description to-SW2-Et0/0
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet0/3
 description to-SW3-Et0/0
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet1/0
 description to-CORE-R1-Gi0/0
 no switchport
 ip address 10.1.255.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
!
interface GigabitEthernet1/1
 description to-SW1-Et0/0
 switchport trunk allowed vlan 10,20,30,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet1/2
 description to-CORE-R2-Gi0/2
 no switchport
 ip address 10.1.255.22 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
!
interface GigabitEthernet1/3
 negotiation auto
!
interface GigabitEthernet2/0
 negotiation auto
!
interface GigabitEthernet2/1
 negotiation auto
!
interface GigabitEthernet2/2
 negotiation auto
!
interface GigabitEthernet2/3
 negotiation auto
!
interface GigabitEthernet3/0
 negotiation auto
!
interface GigabitEthernet3/1
 negotiation auto
!
interface GigabitEthernet3/2
 negotiation auto
!
interface GigabitEthernet3/3
 negotiation auto
!
interface Vlan10
 description FLOOR1
 ip address 10.1.1.2 255.255.255.0
 ip access-group V10-IN in
 ip helper-address 10.1.0.1 
 standby version 2
 standby 10 ip 10.1.1.1
 standby 10 timers 1 3
 standby 10 priority 110
 standby 10 preempt
 ip ospf 1 area 0
!
interface Vlan20
 description FLOOR2
 ip address 10.1.2.2 255.255.255.0
 ip helper-address 10.1.0.1 
 standby version 2
 standby 20 ip 10.1.2.1
 standby 20 timers 1 3
 standby 20 priority 110
 standby 20 preempt
 ip ospf 1 area 0
!
interface Vlan30
 description FLOOR3
 ip address 10.1.3.2 255.255.255.0
 ip access-group V30-IN in
 ip helper-address 10.1.0.1 
 standby version 2
 standby 30 ip 10.1.3.1
 standby 30 timers 1 3
 standby 30 preempt
 ip ospf 1 area 0
!
interface Vlan99
 description MGMT
 ip address 10.1.99.2 255.255.255.0
 standby version 2
 standby 99 ip 10.1.99.1
 standby 99 timers 1 3
 standby 99 priority 110
 standby 99 preempt
 ip ospf 1 area 0
!
router ospf 1
 router-id 10.1.0.11
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet1/2
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list extended V10-IN
 remark VLAN10 may not reach VLAN30
 deny   ip 10.1.1.0 0.0.0.255 10.1.3.0 0.0.0.255
 permit ip any any
ip access-list extended V30-IN
 remark VLAN30 may not reach VLAN10
 deny   ip 10.1.3.0 0.0.0.255 10.1.1.0 0.0.0.255
 permit ip any any
!
control-plane
!
banner motd ^CAuthorized lab use only^C
!
line con 0
 exec-timeout 0 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 0 0
 logging synchronous
 login local
 transport input ssh
!
end
